[package]
name = "m2k"
version = "0.3.0"
edition = "2021"
description = "Mail2000 原生 CLI 與離線工作台"
license = "MIT"
repository = "https://github.com/dnplus/m2k-cli"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
roxmltree = "0.20"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
lettre = "0.11"
mailparse = "0.16"
ical = "0.11"
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
fs2 = "0.4"
ctrlc = "3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
unicode-width = "0.2"

# macOS uses /usr/bin/security instead (src/keychain.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true
