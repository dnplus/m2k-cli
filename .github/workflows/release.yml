name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  TAG: ${{ github.ref_name }}
jobs:
  # Fails fast on Linux before any macOS/Windows minutes are spent.
  verify:
    # Releases are published from the public repo only.
    if: github.repository == 'dnplus/m2k-cli'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "${TAG#v}" = "$version" ] || { echo "tag $TAG does not match Cargo.toml $version" >&2; exit 1; }
      - run: cargo test --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor low; the binary links libdbus-1 and libssl.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libdbus-1-dev pkg-config
        if: runner.os == 'Linux'
      - run: cargo build --locked --release --target "$TARGET"
        shell: bash
      - name: Package
        shell: bash
        run: |
          name="m2k-${TAG//\//-}-$TARGET"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/m2k.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
            archive="dist/$name.zip"
          else
            cp "target/$TARGET/release/m2k" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="dist/$name.tar.gz"
          fi
          # Git Bash on Windows ships sha256sum; macOS ships shasum.
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd dist && $sum "$(basename "$archive")" > "$(basename "$archive").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: m2k-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
